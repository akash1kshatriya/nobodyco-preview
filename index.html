<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NOBODY CO — Ideas. Businesses. Ventures.</title>

    <meta name="description"
          content="NOBODY CO is a multidisciplinary business and parent brand building projects, businesses, and ventures across digital, creative, commercial, and emerging industries.">

    <link rel="icon" type="image/png" href="./NBDYCOBLck.png">
    <style>

        /* =========================
           BASIC RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }


        /* =========================
           BACKGROUND VIDEO
        ========================= */

        #backgroundVideo {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* =========================
           DARK OVERLAY
        ========================= */

        .overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.25);

            z-index: 2;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {

            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            color: white;

            z-index: 3;

            padding: 20px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            width: 130px;
            height: 130px;

            object-fit: contain;

            margin-bottom: 20px;

           

            opacity: 0.95;
        }


        /* =========================
           WELCOME TO
        ========================= */

        h1 {

            font-family: Arial, Helvetica, sans-serif;

            font-size: 22px;

            font-weight: 400;

            letter-spacing: 8px;

            margin-bottom: 18px;

            text-transform: uppercase;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           NOBODY CO
        ========================= */

        h2 {

            font-family: Arial, Helvetica, sans-serif;

            font-size: 150px;

            font-weight: 700;

            letter-spacing: 3px;

            line-height: 0.9;

            text-transform: uppercase;

            white-space: nowrap;

            text-shadow:
                0 4px 30px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           TAGLINE
        ========================= */

        .tagline {

            margin-top: 30px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 25px;

            font-weight: 300;

            letter-spacing: 4px;

            opacity: 0.9;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           CONTACT
        ========================= */

        .contact {

            margin-top: 40px;

            text-align: center;
        }


        .contact-title {

            font-family: Arial, Helvetica, sans-serif;

            font-size: 15px;

            font-weight: 400;

            letter-spacing: 5px;

            text-transform: uppercase;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.8);
        }


        .phone {

            margin-top: 12px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 16px;

            font-weight: 300;

            letter-spacing: 3px;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.8);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .content {

                padding: 15px;
            }


            .logo {

                width: 90px;
                height: 90px;

                margin-bottom: 15px;
            }


            h1 {

                font-size: 16px;

                letter-spacing: 5px;

                margin-bottom: 12px;
            }


            h2 {

                font-size: 16vw;

                letter-spacing: 1px;

                white-space: normal;
            }


            .tagline {

                font-size: 13px;

                letter-spacing: 2px;

                line-height: 1.6;

                max-width: 90%;

                margin-top: 25px;
            }


            .contact {

                margin-top: 30px;
            }


            .contact-title {

                font-size: 12px;

                letter-spacing: 3px;
            }


            .phone {

                font-size: 14px;

                letter-spacing: 2px;

                margin-top: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BACKGROUND VIDEO
    ========================= -->

    <video
        id="backgroundVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source
            src="./universe.mp4"
            type="video/mp4">

    </video>


    <!-- =========================
         DARK OVERLAY
    ========================= -->

    <div class="overlay"></div>


    <!-- =========================
         WEBSITE CONTENT
    ========================= -->

    <main class="content">


        <!-- LOGO -->

        <img
            src="./NBDYCO.png"
            alt="NOBODY CO Logo"
            class="logo">


        <!-- TITLE -->

        <h1>WELCOME TO</h1>

        <h2>NOBODY CO</h2>


        <!-- TAGLINE -->

        <p class="tagline">
            you are the universe experiencing itself
        </p>


        <!-- CONTACT -->

        <div class="contact">

            <div class="contact-title">
                CONTACT
            </div>

            <div class="phone">
                +91 86008 77043
            </div>

        </div>


    </main>


    <!-- =========================
         FORCE VIDEO TO PLAY
    ========================= -->

    <script>

        const video =
            document.getElementById("backgroundVideo");

        video.muted = true;

        video.play().catch(function(error) {

            console.log(
                "Video autoplay was prevented:",
                error
            );

        });

    </script>


</body>

</html>
